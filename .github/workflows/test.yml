name: Game regression checks
on:
  push:
    branches: [main]
    paths-ignore: ['website/**', '**.md']
  pull_request:
    paths-ignore: ['website/**', '**.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: python main.py --headless --level 1 --autoplay --frames 160 --screenshot artifacts/smoke.png
